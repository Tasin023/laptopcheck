name: Build Windows EXE

on:
  workflow_dispatch:      # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest    # <-- this is the key part: a real Windows box
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller pillow

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed --name LaptopCheck
          --icon=logo.ico
          --add-data "logo.ico;."
          --add-data "logo_512.png;."
          LaptopCheckGUI.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: LaptopCheck-exe
          path: dist/LaptopCheck.exe
